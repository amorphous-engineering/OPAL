<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup - OPAL</title>
    <script>
        (function() {
            var theme = localStorage.getItem('opal_theme') || 'dark';
            if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.toggle('dark', theme !== 'light');
        })();
    </script>
    <link rel="stylesheet" href="{{ static_url('vendor/basecoat/basecoat-lyra.cdn.min.css') }}">
    <link rel="stylesheet" href="{{ static_url('css/main.css') }}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .setup-container { width: 520px; max-width: 95vw; }
        .setup-header { text-align: center; margin-bottom: var(--space-lg); }
        .setup-brand {
            font-family: var(--font-mono);
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-orange);
            letter-spacing: 0.1em;
        }
        .setup-subtitle { font-size: 0.75rem; color: var(--text-muted); margin-top: var(--space-xs); }
        .setup-sso { margin-bottom: var(--space-md); }
        .setup-divider {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            margin: var(--space-lg) 0;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .setup-divider::before, .setup-divider::after {
            content: '';
            flex: 1;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
<div class="setup-container">
    <div class="setup-header">
        <div class="setup-brand">OPAL</div>
        <div class="setup-subtitle">First-Run Setup</div>
    </div>

    {% if error %}
    <div style="margin-bottom: var(--space-md); color: var(--accent-red); font-weight: 600;">
        {{ error }}
    </div>
    {% endif %}

    {% if oidc_enabled %}
    <div class="setup-sso">
        <div class="panel">
            <div class="panel-header"><span>SINGLE SIGN-ON</span></div>
            <div class="panel-body">
                <p class="text-muted" style="font-size: 0.85rem; margin-bottom: var(--space-md);">
                    {{ oidc_provider_name }} is configured. The first identity to sign in
                    becomes the administrator.
                </p>
                <a href="/oidc/login" class="btn" data-variant="primary" data-size="sm" style="width: 100%; display: block; text-align: center;">
                    SIGN IN WITH {{ oidc_provider_name | upper }}
                </a>
            </div>
        </div>
    </div>
    <div class="setup-divider">or create a local admin</div>
    {% endif %}

    <form method="POST" action="/setup">

        <div class="panel">
            <div class="panel-header"><span>FIRST ADMIN</span></div>
            <div class="panel-body">
                <div role="group" class="field">
                    <label class="label" for="name">NAME <span class="text-red">*</span></label>
                    <input type="text" name="name" id="name" class="input" placeholder="Full Name"
                           value="{{ name or '' }}">
                </div>
                <div role="group" class="field">
                    <label class="label" for="username">USERNAME <span class="text-red">*</span></label>
                    <input type="text" name="username" id="username" class="input mono"
                           placeholder="lowercase, no spaces" autocapitalize="none"
                           autocomplete="username" value="{{ username or '' }}">
                </div>
                <div role="group" class="field">
                    <label class="label" for="password">PASSWORD <span class="text-red">*</span></label>
                    <input type="password" name="password" id="password" class="input"
                           minlength="10" autocomplete="new-password" placeholder="Minimum 10 characters">
                </div>
                <div role="group" class="field">
                    <label class="label" for="password_confirm">CONFIRM PASSWORD <span class="text-red">*</span></label>
                    <input type="password" name="password_confirm" id="password_confirm" class="input"
                           minlength="10" autocomplete="new-password">
                </div>
                <div role="group" class="field">
                    <label class="label" for="email">EMAIL</label>
                    <input type="email" name="email" id="email" class="input" placeholder="Optional"
                           value="{{ email or '' }}">
                </div>
            </div>
        </div>

        <div style="margin-top: var(--space-md); display: flex; justify-content: flex-end;">
            <button type="submit" class="btn" data-variant="primary" data-size="sm">CONTINUE</button>
        </div>

    </form>

</div>
</body>
</html>
