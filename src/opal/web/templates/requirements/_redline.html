{# Word-level redline between two revisions — strike old / highlight new. #}
<div class="redline mono">
    <div class="text-muted" style="font-size: 0.75rem; margin-bottom: var(--space-xs);">
        REDLINE · rev {{ rev_a.revision }} → rev {{ rev_b.revision }}
    </div>
    <div class="form-label">STATEMENT</div>
    <div class="redline-body">{{ statement_diff }}</div>
    <div class="form-label" style="margin-top: var(--space-sm);">RATIONALE</div>
    <div class="redline-body">{{ rationale_diff }}</div>
</div>
