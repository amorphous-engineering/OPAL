<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OPAL</title>
    <script>
        (function() {
            var theme = localStorage.getItem('opal_theme') || 'dark';
            if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <link rel="stylesheet" href="{{ static_url('css/main.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-container {
            width: 400px;
            max-width: 90vw;
        }
        .login-header {
            text-align: center;
            margin-bottom: var(--space-lg);
        }
        .login-brand {
            font-family: var(--font-mono);
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-orange);
            letter-spacing: 0.1em;
        }
        .login-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: var(--space-xs);
        }
        .login-divider {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            margin: var(--space-lg) 0;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            border-top: 1px solid var(--border-color);
        }
        .login-error {
            border: 1px solid var(--accent-red, #c0392b);
            color: var(--accent-red, #c0392b);
            padding: var(--space-sm);
            margin-bottom: var(--space-md);
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-brand">OPAL</div>
            <div class="login-subtitle">Operations, Procedures, Assets, Logistics</div>
        </div>

        {% if auth_mode is defined and auth_mode == "exe" %}
        <div class="panel">
            <div class="panel-header">EXTERNAL AUTH</div>
            <div class="panel-body">
                <p class="mono" style="margin-bottom: var(--space-md);">Redirecting to exe.dev login...</p>
                <a href="/__exe.dev/login?redirect=/" class="btn btn-primary" style="width: 100%;">GO TO LOGIN</a>
            </div>
        </div>
        {% else %}

        <div class="panel">
            <div class="panel-header">SIGN IN</div>
            <div class="panel-body">
                {% if error %}
                <div class="login-error">{{ error }}</div>
                {% endif %}
                <form method="POST" action="/login">
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" name="username" id="username" class="form-input mono" required
                               autocomplete="username webauthn" autocapitalize="none" autofocus
                               value="{{ username or '' }}">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" name="password" id="password" class="form-input" required
                               autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">SIGN IN</button>
                </form>
            </div>
        </div>

        {% if passkeys_enabled %}
        <div id="passkey-block" style="display: none;">
            <div class="login-divider">or</div>
            <button id="passkey-login" class="btn" style="width: 100%;">SIGN IN WITH PASSKEY</button>
            <div id="passkey-error" class="login-error" style="display: none; margin-top: var(--space-md);"></div>
        </div>
        <script src="{{ static_url('js/webauthn.js') }}"></script>
        <script>
            // WebAuthn only exists in secure contexts (https or localhost)
            if (window.isSecureContext && window.PublicKeyCredential) {
                document.getElementById('passkey-block').style.display = '';
                document.getElementById('passkey-login').addEventListener('click', async function () {
                    var errorBox = document.getElementById('passkey-error');
                    errorBox.style.display = 'none';
                    try {
                        await opalPasskeyLogin();
                        window.location.href = '/';
                    } catch (err) {
                        errorBox.textContent = err.message || 'Passkey sign-in failed.';
                        errorBox.style.display = '';
                    }
                });
            }
        </script>
        {% endif %}

        {% endif %}
    </div>
</body>
</html>
