<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password - OPAL</title>
    <script>
        (function() {
            var theme = localStorage.getItem('opal_theme') || 'dark';
            if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-container { width: 400px; max-width: 90vw; }
        .login-header { text-align: center; margin-bottom: var(--space-lg); }
        .login-brand {
            font-family: var(--font-mono);
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-orange);
            letter-spacing: 0.1em;
        }
        .login-subtitle { font-size: 0.75rem; color: var(--text-muted); margin-top: var(--space-xs); }
        .login-error {
            border: 1px solid var(--accent-red, #c0392b);
            color: var(--accent-red, #c0392b);
            padding: var(--space-sm);
            margin-bottom: var(--space-md);
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-brand">OPAL</div>
            <div class="login-subtitle">First sign-in: set your password</div>
        </div>

        <div class="panel">
            <div class="panel-header">SET PASSWORD</div>
            <div class="panel-body">
                <p class="mono text-muted" style="font-size: 0.8rem; margin-bottom: var(--space-md);">
                    Account <strong>{{ username }}</strong> has no password yet.
                    Choose one now to claim it (minimum 10 characters).
                </p>
                {% if error %}
                <div class="login-error">{{ error }}</div>
                {% endif %}
                <form method="POST" action="/login/set-password">
                    <input type="hidden" name="state" value="{{ state }}">
                    <div class="form-group">
                        <label class="form-label" for="password">New password</label>
                        <input type="password" name="password" id="password" class="form-input" required
                               minlength="10" autocomplete="new-password" autofocus>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password_confirm">Confirm password</label>
                        <input type="password" name="password_confirm" id="password_confirm" class="form-input"
                               required minlength="10" autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">SET PASSWORD AND SIGN IN</button>
                </form>
                <div style="margin-top: var(--space-md); text-align: center;">
                    <a href="/login" class="text-muted mono" style="font-size: 0.75rem;">BACK TO LOGIN</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
