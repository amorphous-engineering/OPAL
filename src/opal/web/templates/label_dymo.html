<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Label - {{ identifier }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
            display: flex;
            align-items: center;
            min-height: 100vh;
            background: #fff;
            color: #000;
        }
        .dymo-label {
            display: flex;
            align-items: baseline;
            gap: 4px;
            white-space: nowrap;
            font-size: 7px;
            line-height: 1;
            padding: 0 2px;
        }
        .dymo-id {
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        .dymo-sep {
            color: #666;
        }
        @media print {
            body { min-height: auto; }
            /* DYMO LabelManager 280: 180dpi, D1 tape up to 12mm (1/2in) —
               its widest supported width. A QR doesn't render legibly at
               that height, so this is a single text line instead of the
               full tag. Fixed strip; the driver cuts the continuous tape
               to length regardless of page size. */
            @page { margin: 0; size: 2in 0.5in; }
        }
    </style>
</head>
<body>
    <div class="dymo-label">
        <span class="dymo-id">{{ identifier }}</span>
        {% if name %}<span class="dymo-sep">&middot;</span><span class="dymo-name">{{ name }}</span>{% endif %}
        {% if location %}<span class="dymo-sep">&middot;</span><span class="dymo-location">{{ location }}</span>{% endif %}
    </div>
    <script>window.print();</script>
</body>
</html>
