name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm --filter frontend lint

      - name: Operation coverage (every operation has a test)
        run: pnpm --filter @opal/server test:ops

      - name: Compiled binary starts and serves
        run: |
          pnpm --filter frontend build
          (cd server && bun scripts/build.ts --target bun-linux-x64 --version 0.0.0-ci)
          export OPAL_DATA_DIR=$(mktemp -d)
          server/dist/opal-linux-x86_64 serve --port 8080 &
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && break; sleep 1; done
          curl -sf localhost:8080/api/health
          curl -sf localhost:8080/ | grep -q '<html'

  legacy-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src/

      - name: Format check
        run: uv run ruff format --check src/

      - name: Test
        run: uv run pytest
