name: CI

on:
  push:
    branches: [master, rewrite]
  pull_request:
    branches: [master, rewrite]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The pnpm version comes from packageManager in package.json. Naming one here as well
      # makes the action refuse to run.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

        with:

          bun-version: 1.4.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      # test:ops runs the whole server suite and then checks that every operation has a test,
      # so the server suite runs there and only there.
      - name: Test (shared, frontend)
        run: pnpm -r --filter '!@opal/server' --if-present test

      - name: Test (server) and operation coverage
        run: pnpm --filter @opal/server test:ops

      - name: Lint
        run: pnpm --filter frontend lint

      - name: Compiled binary starts and serves
        run: |
          pnpm --filter frontend build
          (cd server && bun scripts/build.ts --target bun-linux-x64 --version 0.0.0-ci)
          export OPAL_DATA_DIR=$(mktemp -d)
          server/dist/opal-linux-x86_64 serve --port 8080 &
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && break; sleep 1; done
          curl -sf localhost:8080/api/health
          curl -sf localhost:8080/ | grep -q '<html'

      # Committed records must open for reading. See Records in CLAUDE.md.
      - name: Records open for reading
        run: |
          pnpm --filter frontend exec playwright install --with-deps chromium-headless-shell
          export OPAL_DATA_DIR=$(mktemp -d)
          cp server/assets/demo-seed.db "$OPAL_DATA_DIR/opal.db"
          server/dist/opal-linux-x86_64 serve --port 8081 &
          for i in $(seq 1 30); do curl -sf localhost:8081/api/health && break; sleep 1; done
          cd frontend && node scripts/check-records.mjs 8081 build kestrel-demo
          node scripts/check-markdown.mjs 8081 build kestrel-demo
