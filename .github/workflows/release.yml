name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v2.0.0). Defaults to latest tag on branch."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="$(git describe --tags --abbrev=0)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web client
        run: pnpm --filter frontend build

      # One Linux job cross-compiles every target, one after another.
      - name: Build binaries
        run: pnpm --filter @opal/server build --version "${{ steps.tag.outputs.tag }}"

      - name: Collect assets
        run: |
          mkdir release-assets
          cp server/dist/opal-* server/dist/SHA256SUMS release-assets/
          rm -f release-assets/*.map
          ls -la release-assets/

      # Either order works: push the tag and let this create the release, or
      # create the release in the UI and let this attach the binaries. When the
      # release exists its notes belong to whoever wrote them, so only assets
      # are uploaded. --clobber makes a re-run replace them.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists. Uploading assets to it."
            gh release upload "$tag" release-assets/* --clobber
          else
            echo "Release $tag does not exist. Creating it."
            gh release create "$tag" release-assets/* --generate-notes --latest
          fi
