name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v2.0.0). Defaults to latest tag on branch."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Tag names and inputs arrive through env, not ${{ }} in the script, so
      # shell syntax in a tag name stays data and does not run.
      - name: Determine tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$(git describe --tags --abbrev=0)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web client
        run: pnpm --filter frontend build

      # One Linux job cross-compiles every target, one after another.
      - name: Build binaries
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: pnpm --filter @opal/server build --version "$TAG"

      - name: Collect assets
        run: |
          mkdir release-assets
          cp server/dist/opal-* server/dist/SHA256SUMS release-assets/
          rm -f release-assets/*.map
          ls -la release-assets/

      # Either order works: push the tag and let this create the release, or
      # create the release in the UI and let this attach the binaries. When the
      # release exists its notes belong to whoever wrote them, so only assets
      # are uploaded. --clobber makes a re-run replace them.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          tag="$TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists. Uploading assets to it."
            gh release upload "$tag" release-assets/* --clobber
          else
            echo "Release $tag does not exist. Creating it."
            # A semver tag with a suffix (v2.0.0-rc.1) is a prerelease. It must not take the
            # Latest mark, which is what the installers give by default.
            case "$tag" in
              *-*) gh release create "$tag" release-assets/* --generate-notes --prerelease --latest=false ;;
              *)   gh release create "$tag" release-assets/* --generate-notes --latest ;;
            esac
          fi
