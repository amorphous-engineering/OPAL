# Transcribed from HCR-5100 R01. Copyright 2024 Half Cat Rocketry. GPL-3.0-or-later. See README.md.
#
# key and external_pn: the number the guidebook prints. The guidebook prints some numbers more than
#   one way, so one rule picks the form used here:
#     - a bought part takes the number in its order link in the bills of material (Section IV,
#       and 6.2 for ground equipment), which is the number to order by. A row with no link takes
#       its Part Number column;
#     - a part Half Cat designed takes the number in the parts list of the procedure that first
#       uses it, or its appendix table (C.1, D.1, E.1) when that list gives none.
#   Every other form the guidebook prints is listed under also_printed_as.
#   An en dash in a printed number is written as a hyphen. A vendor number printed as a pair
#   (9056K42-9056K423) is written as its second half. A part with no number anywhere has a
#   lower-case name as its key and no external_pn.
# name: the Item name in Section IV when the part has a line there, else the name in the procedure's
#   parts list.
# description: the vendor description for a bought part, the procedure's description for a made one.
# supplier.price: as printed in Section IV. It is the price of the pack when `pack` is given.
# tier, tracking, category: chosen for this demo. On the vehicle is FLIGHT; raw stock, tooling and
#   consumables are DEV. Machined parts and assemblies are serialized; the rest is tracked by lot.
# lot_rule: `required` where the supplier's lot is traced: the O-rings, which age and swell. No tier
#   asks for a lot, so every other receipt takes none.
#
# OPAL assigns its own number (SPX-F-0001 and so on) when the part is created.

