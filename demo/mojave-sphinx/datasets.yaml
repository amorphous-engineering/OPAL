  - key: launches
    name: Half Cat launches of Mojave Sphinx
    description: |
      Apogee of each launch, from HCR-5100 R01 Section 3.3 (contents list, p. 86). Launches 17
      and 18 are marked SN02 there. Half Cat Rocketry's data, not this team's.
