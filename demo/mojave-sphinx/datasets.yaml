# Datasets.
#
# The first two are Half Cat Rocketry's own development record, taken from the contents list of
# HCR-5100 R01 Section III (p. 86): the total impulse of each static fire of the prototype and the
# apogee of each launch. They are here as reference data for the team. They are not this team's
# results. The third holds measurements this team recorded on its own work orders (fictional).
#
# Adapted from HCR-5100 R01. Copyright 2024 Half Cat Rocketry. GPL-3.0-or-later. See README.md.

datasets:
  - key: static-fires
    name: Half Cat static fires of the Mojave Sphinx prototype
    description: |
      Total impulse of each static fire, from HCR-5100 R01 Section 3.2 (contents list, p. 86).
      Half Cat Rocketry's data, not this team's.
    fields:
      - { name: test, type: number, required: true }
      - { name: date, type: date, required: true }
      # OPAL has no unit for impulse, so the unit is in the name: newton seconds.
      - { name: total_impulse_N_s, type: number, chart: true, required: true }
    rows:
      - { test: 1, date: '2023-11-04', total_impulse_N_s: 2716 }
      - { test: 2, date: '2023-11-04', total_impulse_N_s: 2723 }
      - { test: 3, date: '2023-11-04', total_impulse_N_s: 2464 }
      - { test: 4, date: '2023-11-18', total_impulse_N_s: 2429 }
