  - key: tank-measurements
    name: Tank measurements
    description: Distances recorded while building the propellant tank, one point per work order step.
    procedure: propellant-tank-assembly
    fields:
      - { name: measurement, type: text, required: true }
      - { name: distance, type: number, unit: in, chart: true, required: true }
