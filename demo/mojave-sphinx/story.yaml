  # The analysis in the guidebook uses a smaller hole than the procedure drills.
  - at: '2026-07-12T19:40:00Z'
    by: test
    risk:
      key: risk-closure-margin
      title: Tank closure margin not shown for the hole size drilled
      part: TANK-36L-047V-2X8X313C
      owner: test
      condition: >-
        HCR-5100 Sections 2.4.3 and 2.4.4 (p. 72) work out bolt tear-out and casing tensile stress
        with a 0.328 in bolt hole. OP 2 step 3 drills the tank tube 11/32 in, and {wo-tank-casing}
        drilled it that size.
      departure: >-
        The margin at the closure joints of this tank is lower than the guidebook's figures, and
        nobody has worked out by how much.
      consequence: >-
        A closure joint yields or tears out under tank pressure. The tank is pressurized only with
        everyone at a safe distance, so the loss would be the vehicle and the launch.
      probability: 2
      impact: 4
      watch:
        observable: Tear-out and tensile margins worked out for an 11/32 in hole
        threshold: Either margin below 0.3
        contingency: Stop work on the tank and ask Half Cat Rocketry before any pressure is put in it.

  - at: '2026-07-12T19:52:00Z'
    by: test
    issue:
      key: task-margin
      type: task
      title: Work out the tank closure margins for an 11/32 in hole
      assign: test
      parts: [TANK-36L-047V-2X8X313C]
      description: >-
        Redo the bolt tear-out and casing tensile calculations of HCR-5100 Sections 2.4.3 and 2.4.4
        (p. 72) with the hole size OP 2 drills. Ask Half Cat Rocketry which hole size the analysis
        was meant for.

  - at: '2026-07-12T19:55:00Z'
    by: test
    risk_issue: { risk: risk-closure-margin, issue: task-margin, role: research }

  - at: '2026-07-12T20:00:00Z'
    by: test
    risk_disposition:
      risk: risk-closure-margin
      disposition: research
      note: Open until {task-margin} gives the margins.

