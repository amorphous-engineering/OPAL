# What the team has done so far, in date order.
#
# Everything here is fictional: the people, the dates, the orders, the measurements and the notes.
# The loader enters each event through OPAL's own operations, as the person named in `by`, with the
# clock set to `at` (UTC).
#
# Where the team stands at the end of the file: the first vehicle and the ground equipment are
# built. The first launch attempt ended in a dumped load and a work order closed short. The second
# flew and came down without its main parachute. The vehicle is on the rail for a third time, with
# open issues due at different points of that work order. A second vehicle is under way: its tank
# assembly is on the bench, held by an open non-conformance, and one order for it has not come.
#
# An event states its time with `at`, or follows the one before it by `after` minutes.
#
# Parts the team prints, machines or has cut are booked into stock by a `make` event. The guidebook
# gives drawings and print settings for them (Appendices C to E), not steps, so the dataset has no
# procedure for making them.

