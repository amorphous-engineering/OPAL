  # The guidebook's own position on unrated fittings, taken on as an accepted risk.
  - at: '2026-07-13T18:40:00Z'
    by: build
    risk:
      key: risk-unrated-fittings
      title: Fittings and tubing not rated to nitrous oxide vapor pressure
      asset: Oxidizer fill line and vehicle plumbing
      owner: build
      condition: >-
        HCR-5100 Section 1.3.4 (p. 13): "some tubing and many of the fittings used on Half Cat type
        rockets will not be explicitly rated to the maximum expected operating pressures that are
        possible with saturated N2O."
      departure: A fitting or tube lets go while the system holds nitrous oxide.
      consequence: Loss of the oxidizer load and damage to the vehicle or ground equipment. Injury if anyone is near.
      probability: 2
      impact: 5
      residual_probability: 2
      residual_impact: 2
      watch:
        observable: People inside the safe distance while the system is pressurized
        threshold: Anyone
        contingency: Stop the fill and vent, as Launch Operations has it.

  - at: '2026-07-13T18:55:00Z'
    by: build
    risk_accept:
      risk: risk-unrated-fittings
      rationale: >-
        The guidebook accepts these parts "so long as they are pressurized only when personnel are
        at a safe distance from the system" (p. 13), and the requirement for remote fill holds us
        to that. With nobody near, what is left is hardware.

