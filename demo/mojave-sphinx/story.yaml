      title: O-rings swell if the tank sits fuelled
      part: propellant-tank-assembly
      owner: test
      condition: >-
        HCR-5100 Section 2.7 (p. 84): "O-rings exposed to fuel will swell over time, so that they
        may be unusable even after only one cycle if the rocket has been sitting for more than a
        few days."
      departure: The tank is fuelled, the launch slips, and the rocket sits.
      consequence: >-
        Table 2.9 (p. 85) gives fuel leakage out of the tank for the fuel bulkhead O-ring, and
        difficulty pushing the piston into the fuel tank for the piston O-ring.
      probability: 3
      impact: 3
      watch:
        observable: Days between fuelling and launch
        threshold: More than a few days, as the guidebook puts it
        contingency: Replace the fuel bulkhead and piston O-rings before the next fill, as Vehicle Preparation allows.

