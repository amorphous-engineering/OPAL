# Assemble Purge System (Optional)
#
# Adapted from HCR-5100 R01, Section 6.3, OP 3: Assemble Purge System (Optional) (pp. 248-250).
# Copyright 2024 Half Cat Rocketry. GPL-3.0-or-later. See ../README.md.
#
# Text blocks are Markdown. A blank line starts a new paragraph; the loader joins the lines of a
# paragraph, so wrap them freely.

key: gse-purge-system
name: Assemble Purge System (Optional)
# build: the work order produces a part. op: the work order acts on hardware that already exists.
type: build
source:
  document: HCR-5100 R01
  section: 'Section 6.3, OP 3: Assemble Purge System (Optional)'
  pages: 248-250

description: |
  Assemble the purge system from a servo-actuated ball valve and its fittings, and add a check valve
  to the fill assembly.

  Tools: wrenches, PTFE thread sealant tape.

output:
  part: purge-system
  quantity: 1

# "Gather the following" in the guidebook (p. 248).
kit:
  - part: SABV-04FF
    quantity: 1
  - part: '50785K92'
    quantity: 1
  - part: '50785K273'
    quantity: 1
  - part: '97149A370'
    quantity: 1
  - part: '5485K22'
    quantity: 1
  - part: '9396T32'
    quantity: 2
  - part: '7768K26'
    quantity: 2

operations:
  - title: Assemble Purge System (Optional)
    source: { section: 'Section 6.3, OP 3', pages: 248-250 }
    workcenter: BENCH
    steps:
      - title: Assemble the valve and fittings
        source: { step: 1, page: 249 }
        instructions: |
          Apply 2-3 wraps of PTFE tape to the male threads of QTY 2 9396T32 push-to-connect fittings,
          QTY 1 5485K22 male straight connector, and QTY 1 7768K26 check valve. Assemble with QTY 1
          50785K273 through-wall fitting and QTY 1 SABV-04FF valve as shown. Tighten all fittings to
          snug, 1-3 turns past hand tight.

      - title: Fit the hex nut and jam nut
        source: { step: 2, page: 249 }
        instructions: |
          Thread the 97149A370 hex nut onto the 50785K273 through-wall fitting until there is
          approximately one thread between the nut and fixed hex portion of the fitting, then
          loose-install the included brass jam nut and toothed washer.
        images:
          - file: photos/gse-op-03/purge-valve-assembly.jpg
            caption: Purge valve assembly with part numbers labeled, side view with the servo on top.
            source_page: 249

      - title: Fit the fill check valve
        source: { step: 3, page: 250 }
        instructions: |
          If already installed, remove QTY 1 9396T32 push-to-connect fitting from the fill assembly.
          Install QTY 1 7768K26 check valve into the SABV-04FF outlet, then reinstall QTY 1 9396T32
          into the check valve outlet as shown. Apply 2-3 fresh wraps of PTFE tape to each fitting
          prior to installation.

          *Note: This check valve is only required if a purge valve is also present; it prevents
          cross-contamination between the CO₂ and N₂O supply tanks in the event that both valves are
          accidentally commanded open at the same time with the tanks at slightly different
          pressures. If a purge valve is not included, no check valves are needed on the fill
          system.*
        images:
          - file: photos/gse-op-03/check-valve-on-fill-valve.jpg
            caption: Check valve and push-to-connect fitting on the fill assembly, with part numbers labeled.
            source_page: 250

# Every difference from the guidebook's text, other than layout. This list is also the notice of
# modification that the GPL asks for.
changes_from_source:
  - Step titles are new. The guidebook's steps have none.
  - The first sentence of the description is new.
  - >-
    The tools line is compiled from the steps. Ground support equipment has no Required Tools list.
    No step names a wrench; the steps ask for fittings tightened 1-3 turns past hand tight.
  - PTFE thread sealant tape, named in steps 1.1 and 1.3 and not in the parts list, is in the tools line.
  - >-
    The 50785K273 fitting is called the through-wall fitting throughout. Step 1 calls it the
    through-wall connector.
  - >-
    The kit holds 50785K92 as the parts list prints it, although no step uses it.
  - Image captions are new.
