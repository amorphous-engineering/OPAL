# Avionics Bay Assembly
#
# Adapted from HCR-5100 R01, Section V, OP 10: Avionics Bay Assembly (pp. 205-216).
# Copyright 2024 Half Cat Rocketry. GPL-3.0-or-later. See ../README.md.
#
# Text blocks are Markdown. A blank line starts a new paragraph; the loader joins the lines of a
# paragraph, so wrap them freely.

key: avionics-bay-assembly
name: Avionics Bay Assembly
# build: the work order produces a part. op: the work order acts on hardware that already exists.
type: build
source:
  document: HCR-5100 R01
  section: 'Section V, OP 10: Avionics Bay Assembly'
  pages: 205-216

description: |
  Assemble the printed avionics bay coupler on four threaded rods, mount two altimeters and their
  batteries on the avionics bay sled, wire them, and close the sled into the coupler between two
  bulkheads.

  Tools: wrenches, small phillips screwdriver, drill, #16 drill bit, #50 drill bit, fine point pen or mechanical pencil, 3/16 in
  wrench or pliers, wire stripper/cutter, permanent marker, cyanoacrylate (superglue) gel or other
  suitable adhesive, electrical tape. If the avionics bay sled is not prefabricated: 1/4 in
  plywood and a fine-toothed saw. Optional: masking tape.

output:
  part: avionics-bay-assembly
  quantity: 1

# "Gather the following" in the guidebook (p. 206).
