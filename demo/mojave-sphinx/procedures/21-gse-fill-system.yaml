# Assemble Fill System
#
# Adapted from HCR-5100 R01, Section 6.3, OP 2: Assemble Fill System (pp. 243-247).
# Copyright 2024 Half Cat Rocketry. GPL-3.0-or-later. See ../README.md.
#
# Text blocks are Markdown. A blank line starts a new paragraph; the loader joins the lines of a
# paragraph, so wrap them freely.

key: gse-fill-system
name: Assemble Fill System
# build: the work order produces a part. op: the work order acts on hardware that already exists.
type: build
source:
  document: HCR-5100 R01
  section: 'Section 6.3, OP 2: Assemble Fill System'
  pages: 243-247

description: |
  Assemble the CGA 326 supply connection, the fill valve assembly with its pressure gauge, and the
  fill line bulkhead assembly for the ground support equipment.

  Tools: wrenches, PTFE tape.

outputs:
  - part: fill-valve-assembly
    quantity: 1
  - part: fill-line-bulkhead-assembly
    quantity: 1

# "Gather the following" in the guidebook (p. 243).
kit:
  - { part: SABV-04FF, quantity: 1, for: fill-valve-assembly }
  - { part: '79215A673', quantity: 1, for: fill-valve-assembly }
  - { part: '79215A672', quantity: 1, for: fill-valve-assembly }
  - { part: '50785K92', quantity: 1, for: fill-valve-assembly }
  - { part: '50675K162', quantity: 2, for: fill-valve-assembly }
  - { part: '4468K041', quantity: 1, for: fill-valve-assembly }
  - { part: '50785K273', quantity: 1, for: fill-valve-assembly }
  - { part: '97149A370', quantity: 1, for: fill-valve-assembly }
  - { part: '50785K222', quantity: 1, for: fill-valve-assembly }
  - { part: '3846K93', quantity: 1, for: fill-valve-assembly }
  - { part: '5485K22', quantity: 1, for: fill-valve-assembly }
  - { part: '9396T32', quantity: 1, for: fill-valve-assembly }
  - { part: '9396T31', quantity: 2, for: fill-line-bulkhead-assembly }
  - { part: '50785K272', quantity: 1, for: fill-line-bulkhead-assembly }

operations:
  - title: Assemble Fill System
    source: { section: 'Section 6.3, OP 2', pages: 243-247 }
    workcenter: BENCH
    steps:
      - title: Fit the CGA 326 nut
        source: { step: 1, page: 244 }
        instructions: |
          Slide QTY 1 79215A672 CGA 326 nut over QTY 1 79215A673 CGA 326 adapter nipple, so that the
          threads cover the rounded nub.

      - title: Join the flared adapter
        source: { step: 2, page: 244 }
        instructions: |
          Apply 2-2 wraps of PTFE tape to QTY 1 79215A673 CGA 326 adapter nipple and QTY 1 50675K162
          37 degree flared adapter. Connect the 37 degree flared adapter to the CGA 326 adapter nipple
          using QTY 1 50785K92 female straight connector as shown. Tighten all fittings to snug, 1-3
          turns past hand tight.
        images:
          - file: photos/gse-op-02/cga-adapter-side.jpg
            caption: 37 degree flared adapter, female straight connector, CGA 326 adapter nipple and CGA 326 nut, side view.
            source_page: 244

      - title: Assemble the fill valve fittings
        source: { step: 3, page: 245 }
        instructions: |
          Apply 2-3 wraps of PTFE tape to the male threads on QTY 1 50675K162 37 degree flared
          adapter, QTY 1 50785K222 tee, QTY 1 5485K22 male straight connector, and QTY 1 9396T32
          push-to-connect fitting. Assemble with QTY 1 50785K273 through-wall fitting and QTY 1
          SABV-04FF as shown. Tighten all fittings to snug, 1-3 turns past hand tight. Ensure the
          50785K222 tee is clocked as shown.
        images:
          - file: photos/gse-op-02/fill-valve-top.jpg
            caption: Fill valve assembly, top view.
            source_page: 245
          - file: photos/gse-op-02/fill-valve-side-labeled.jpg
            caption: Fill valve assembly, side view, with part numbers labeled.
            source_page: 245

      - title: Install the hex nut
        source: { step: 4, page: 245 }
        instructions: |
          Thread the 97149A370 hex nut onto the 50785K273 through-wall fitting until there is
          approximately one thread between the nut and fixed hex portion of the fitting, then
          loose-install the included brass jam nut and toothed washer.

      - title: Install the pressure gauge
        source: { step: 5, page: 246 }
        instructions: |
          Install QTY 1 3846K93 gauge into the side port on the 50785K222 tee, with 2-3 wraps of PTFE
          tape applied to the threads. Tighten until snug, clocked so that the gauge scale is
          horizontal for readability.
        images:
          - file: photos/gse-op-02/gauge-on-tee.jpg
            caption: Gauge in the side port of the tee on the fill valve assembly.
            source_page: 246

      - title: Assemble the fill line bulkhead
        source: { step: 6, page: 247 }
        instructions: |
          Apply 2-3 wraps of PTFE tape to QTY 1 9396T31 push-to-connect fittings and install into
          each end of QTY 1 50785K272 through-wall fitting as shown to form the fill line bulkhead
          assembly. Tighten all fittings to snug, 1-3 turns past hand tight.
        images:
          - file: photos/gse-op-02/fill-line-bulkhead.jpg
            caption: Fill line bulkhead assembly, side view.
            source_page: 247

# Every difference from the guidebook's text, other than layout. This list is also the notice of
# modification that the GPL asks for.
changes_from_source:
  - Step titles are new. The guidebook's steps have none.
  - The first sentence of the description is new.
  - >-
    The tools line is compiled from the steps. Ground equipment has no Required Tools list. PTFE
    tape is named in steps 1.2, 1.3, 1.5 and 1.6 but not in the parts list (p. 243).
  - >-
    The build has two products. Steps 1.3 to 1.5 make the fill valve assembly and step 1.6 the fill
    line bulkhead assembly. OP 2 names only the second; the name "fill valve assembly" is the one
    OP 5 uses (pp. 256-257). OP 3 step 3 (p. 250) calls it the fill assembly.
  - >-
    Kit: the parts of steps 1.1 and 1.2, and the 4468K041 hose (printed 4468K811), which no step uses, are counted into
    the fill valve assembly.
  - >-
    Step 1.3: the part number printed for the male straight connector is replaced by 5485K22.
  - >-
    The 79215A673 nipple is called the CGA 326 adapter nipple throughout. Step 2 also calls it the
    adapter nipple and the CGA adapter nipple.
  - >-
    The 50675K162 fitting is called the 37 degree flared adapter throughout. Step 2 calls it the 37
    degree flared adapter fitting and the flared adapter fitting.
  - >-
    The two pictures printed under step 4 (p. 245) are placed on step 1.3, which refers to them
    ("as shown", "clocked as shown"). They also show the step 1.4 hex nut in place.
  - Image captions are new.
