[project]
name = "opal"
version = "1.4.0b1"
description = "Operations, Procedures, Assets, Logistics - ERP for small teams and hardware projects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "OPAL Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "jinja2>=3.1.4",
    # >=0.0.30: earlier versions have a quadratic urlencoded-parse DoS
    # (PYSEC-2026-3036/3037) reachable on every form POST, incl. /login.
    "python-multipart>=0.0.30",
    "aiofiles>=24.1.0",
    "httpx>=0.28.0",
    "segno>=1.6.0",
    "packaging>=24.0",
    "mcp>=1.0",
    "argon2-cffi>=25.1.0",
    "fido2>=1.1",
    # Pulled in transitively by fido2; pin the floor to clear the bundled
    # OpenSSL advisory (GHSA-537c-gmf6-5ccf) fixed in 48.0.1.
    "cryptography>=48.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]
tui = [
    "textual>=0.89.0",
]
app = [
    "textual>=0.89.0",
    "pyinstaller>=6.0",
]
e2e = [
    "playwright>=1.49.0",
]

[project.scripts]
opal = "opal.__main__:main"
opal-app = "opal.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opal"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "F821", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src/opal --cov-report=term-missing"

[tool.coverage.run]
source = ["src/opal"]
omit = ["src/opal/tui/*"]
