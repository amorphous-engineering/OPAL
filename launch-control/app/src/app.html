<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			try {
				if (!localStorage.getItem('mode-watcher-mode'))
					localStorage.setItem('mode-watcher-mode', 'light');
			} catch {
				/* storage unavailable: mode-watcher falls back to the system setting */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
